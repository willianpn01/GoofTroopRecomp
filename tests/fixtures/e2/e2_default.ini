; Goof Troop Recomp -- host configuration.
; Host-only: nothing here changes how the game runs, only which
; physical key or controller input produces each SNES button.
; Values are comma-separated tokens; "none" = unbound.  Keys are
; physical positions (US layout names); gamepad inputs are named by
; position (bottom/right/left/top = SNES B/A/Y/X by default).
[meta]
schema=1

[input.player1.keyboard]
up=UP
down=DOWN
left=LEFT
right=RIGHT
b=Z
a=X
y=A
x=S
l=C
r=V
start=RETURN,KP_ENTER
select=RSHIFT

[input.player1.gamepad]
up=dpad_up,left_stick_up
down=dpad_down,left_stick_down
left=dpad_left,left_stick_left
right=dpad_right,left_stick_right
b=bottom
a=right
y=left
x=top
l=left_shoulder
r=right_shoulder
start=start
select=back

[input.player2.keyboard]
up=I
down=K
left=J
right=L
b=N
a=M
y=B
x=H
l=U
r=O
start=RCTRL
select=RALT

[input.player2.gamepad]
up=dpad_up,left_stick_up
down=dpad_down,left_stick_down
left=dpad_left,left_stick_left
right=dpad_right,left_stick_right
b=bottom
a=right
y=left
x=top
l=left_shoulder
r=right_shoulder
start=start
select=back
